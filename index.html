<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4e89">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FCL Trainer">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem("fcl-theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <title>FC Lorsbach – Trainer-App</title>
</head>
<body>
  <header class="kopf">
    <img class="kopf__logo" src="logo.png" alt="Vereinswappen">
    <h1 class="kopf__titel"><span data-verein>FC Lorsbach</span><small data-app-titel>Trainer-App</small></h1>
    <button class="kopf__btn" id="theme-btn" type="button" aria-label="Farbmodus"></button>
  </header>

  <main class="inhalt">
    <nav class="kacheln" id="kacheln" aria-label="Funktionen">
      <noscript>Bitte JavaScript aktivieren.</noscript>
    </nav>
    <p class="fusszeile">Hofheim am Taunus</p>
  </main>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
